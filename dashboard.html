<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1e293b;padding:20px;border-right:1px solid #334155}
.sidebar p{margin-bottom:20px}
.sidebar a{display:block;padding:10px 12px;color:#94a3b8;text-decoration:none;border-radius:8px;margin-bottom:8px}
.sidebar a.active,.sidebar a:hover{background:#334155;color:white}
.main{flex:1;padding:30px}
.stat-card{background:#1e293b;border:1px solid #334155;padding:20px;border-radius:12px;flex:1;text-align:center}
.stat-card h2{font-size:32px;color:#36B9F0}
.stat-card p{color:#94a3b8;margin-top:5px}
.card-box{background:#1e293b;border:1px solid #334155;padding:20px;border-radius:12px}
button{background:linear-gradient(90deg,#36B9F0,#2dd4bf);border:none;padding:12px 20px;border-radius:8px;color:black;font-weight:bold;cursor:pointer}
button:hover{opacity:0.9}
h2{color:#e2e8f0}
@media(max-width:700px){.app{flex-direction:column}.sidebar{width:100%}}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
<p style="color:#36B9F0;font-weight:bold;">📚 Assignment Tracker</p>
<a href="dashboard.html" class="active">🏠 Dashboard</a>
<a href="addassignment.html">➕ Add Assignment</a>
<a href="viewassignments.html">📖 View Assignments</a>
<a href="login.html">🚪 Logout</a>
</div>
<div class="main">
<h2>Welcome, Student! 👋</h2>
<div style="display:flex;gap:15px;max-width:500px;margin-top:20px;">
<div class="stat-card"><h2 id="totalCount">0</h2><p>Total</p></div>
<div class="stat-card"><h2 id="doneCount">0</h2><p>Completed</p></div>
</div>
<div class="card-box" style="max-width:500px;margin-top:20px;">
<button onclick="location.href='addassignment.html'">+ Add Assignment</button>
</div>
</div>
</div>
<script>
let data=localStorage.getItem("assignments");
let list=data?JSON.parse(data):[];
document.getElementById("totalCount").innerHTML=list.length;
let c=0;for(let i=0;i<list.length;i++){if(list[i].completed)c++;}
document.getElementById("doneCount").innerHTML=c;
</script>
</body>
</html>
