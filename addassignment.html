<!DOCTYPE html>
<html>
<head>
    <title>Add Assignment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1e293b;padding:20px;border-right:1px solid #334155}
.sidebar p{margin-bottom:15px}
.sidebar hr{margin-bottom:15px;border:0;border-top:1px solid #334155}
.sidebar a{display:block;padding:10px 12px;color:#94a3b8;text-decoration:none;border-radius:8px;margin-bottom:8px}
.sidebar a.active,.sidebar a:hover{background:#334155;color:white}
.main{flex:1;padding:30px}
.card-box{background:#1e293b;border:1px solid #334155;padding:24px;border-radius:12px}
.card-box p{margin:12px 0 6px 0;color:#cbd5e1;font-size:14px;text-align:left}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
textarea{height:80px;resize:none}
button{width:100%;background:linear-gradient(90deg,#36B9F0,#2dd4bf);border:none;padding:12px;border-radius:8px;color:black;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{opacity:0.9}
h2{color:#e2e8f0;margin-bottom:15px}
@media(max-width:700px){.app{flex-direction:column}.sidebar{width:100%}}
</style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <p style="color:#36B9F0; font-weight:bold;">📚 Assignment Tracker</p>
        <hr>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="addassignment.html" class="active">➕ Add Assignment</a>
        <a href="viewassignments.html">📖 View Assignments</a>
        <a href="login.html">🚪 Logout</a>
    </div>
    <div class="main">
        <h2>Add New Assignment</h2>
        <div class="card-box" style="max-width:400px;">
            <form id="myForm">
                <p>Assignment Title</p>
                <input type="text" id="title" placeholder="Enter title">
                <p>Subject</p>
                <select id="subject">
                    <option value="">Select Subject</option>
                    <option>Maths</option>
                    <option>Computer</option>
                    <option>Science</option>
                    <option>English</option>
                </select>
                <p>Description</p>
                <textarea id="desc" placeholder="Enter description"></textarea>
                <p>Due Date</p>
                <input type="date" id="date">
                <br><br>
                <button type="submit">Save Assignment</button>
                <a href="dashboard.html" style="color:#FF4FA3; display:block; text-align:center; margin-top:12px; font-size:13px; text-decoration:none;">Back to Dashboard</a>
            </form>
        </div>
    </div>
</div>
<script>
    document.getElementById("myForm").addEventListener("submit", function(e){
        e.preventDefault();
        let title = document.getElementById("title").value.trim();
        let subject = document.getElementById("subject").value;
        let desc = document.getElementById("desc").value.trim();
        let date = document.getElementById("date").value;
        if(title == ""){ alert("Please enter title"); return; }
        if(subject == ""){ alert("Please select subject"); return; }
        if(date == ""){ alert("Please select date"); return; }
        let newAssignment = { title: title, subject: subject, desc: desc, date: date, completed: false };
        let oldData = localStorage.getItem("assignments");
        let assignments = [];
        if(oldData != null){ assignments = JSON.parse(oldData); }
        assignments.push(newAssignment);
        localStorage.setItem("assignments", JSON.stringify(assignments));
        alert("Assignment Saved!");
        window.location.href = "viewassignments.html";
    });
</script>
</body>
</html>
